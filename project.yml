# XcodeGen spec — the source of truth for SimpleSMBFileBrowser.xcodeproj.
#
# The generated .xcodeproj IS committed, so the repo can be opened without any
# extra tooling. Regenerate after changing this file with:
#     xcodegen generate
# See README.md ("Project generation") for why the project is generated.

name: SimpleSMBFileBrowser

options:
  bundleIdPrefix: eu.org.amirulandalib
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    # Pinned to a revision, not a release tag, and the reason is specific.
    #
    # 4.0.3 — still the latest tag — passes an empty password straight through
    # to smb2_set_password. libsmb2 then treats it as a real (zero-length)
    # password and computes an NTLMv2 response, instead of sending an anonymous
    # session. Samba rejects that with EPERM, so *guest shares cannot be
    # connected to at all* on 4.0.3. Verified against Samba 4.19.5: every guest
    # credential combination failed, while macOS's own client connected fine.
    #
    # Upstream commit 497ce6e "fix: empty password handling" (2025-12-27) maps
    # an empty password to NULL, which makes libsmb2 send NTLMSSP with the
    # anonymous flag. With it, guest connect, listing and the full write cycle
    # all succeed against the same server. The fix is on master and has never
    # been tagged, hence the pin.
    #
    # Revisit when a release above 4.0.3 ships, and move back to `from:`.
    revision: 497ce6e3d39f36b1b5af44f56b9a1273b6c91164

# Settings shared by every target.
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing is declared per-target via the adhocSigned template below, not
    # here: XcodeGen injects its own target-level preset
    # (CODE_SIGN_IDENTITY = "iPhone Developer") for iOS application targets,
    # and a target-level setting beats a project-level one.

targetTemplates:
  # Ad-hoc signing ("Sign to Run Locally"). No Apple Developer team is assumed,
  # so the project builds, runs and tests on all three platforms out of the box.
  # See README for switching to a real team.
  adhocSigned:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGNING_REQUIRED: NO
        # Signing must be ALLOWED even though it isn't REQUIRED: with it off,
        # no entitlements are applied to the binary at all, and every Keychain
        # call fails with errSecMissingEntitlement (-34018). Ad-hoc signing is
        # enough to make the entitlements real on the simulator and on Mac.
        CODE_SIGNING_ALLOWED: YES

targets:
  SimpleSMBFileBrowser:
    templates: [adhocSigned]
    # A single multiplatform target (iPhone, iPad, Mac) rather than one target
    # per platform, matching Xcode's own Multiplatform App template: SDKROOT is
    # resolved per-destination and TARGETED_DEVICE_FAMILY spans 1,2,6.
    type: application
    platform: iOS
    sources:
      - path: SimpleSMBFileBrowser
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
    dependencies:
      # embed is required, not optional. AMSMB2's Package.swift declares its
      # library as `type: .dynamic`, so without an embed phase the framework is
      # left in PackageFrameworks/ beside the app and never copied into
      # Contents/Frameworks. The app then launches only from inside DerivedData,
      # where @rpath happens to resolve to that sibling directory, and dies with
      # "Library not loaded: @rpath/AMSMB2.framework" anywhere else — including
      # from a .dmg.
      - package: AMSMB2
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Simple SMB
        # Without this the module would be derived from PRODUCT_NAME as
        # "Simple_SMB", which is what tests would have to import.
        PRODUCT_MODULE_NAME: SimpleSMBFileBrowser
        PRODUCT_BUNDLE_IDENTIFIER: eu.org.amirulandalib.SimpleSMBFileBrowser
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

        # Info.plist: generated keys plus a small partial plist holding the
        # entries Xcode has no INFOPLIST_KEY_ equivalent for (local network
        # usage, queryable URL schemes, document-in-place support).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SimpleSMBFileBrowser/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Simple SMB
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        # Split per-idiom. iPad multitasking requires all four orientations
        # whenever UIRequiresFullScreen is NO — declaring only three makes
        # the build warn and undermines Split View / Slide Over support.
        # iPhone keeps upside-down off, which is conventional.
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

        # Both conventions, because this is one target building for both
        # platforms. An iOS bundle puts frameworks at Contents-less
        # Frameworks/ beside the executable; a macOS bundle puts them at
        # Contents/Frameworks, one level up from Contents/MacOS. XcodeGen
        # emits only the iOS form because the target declares platform: iOS,
        # which makes the Mac app fail at launch with
        # "Library not loaded: @rpath/AMSMB2.framework".
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../Frameworks @loader_path/Frameworks"
        CODE_SIGN_ENTITLEMENTS: SimpleSMBFileBrowser/Resources/SimpleSMBFileBrowser.entitlements
        # OFF, deliberately, and only because this project ad-hoc signs.
        # Hardened runtime enforces library validation, which requires the
        # process and every library it loads to share a Team ID. Two
        # independent ad-hoc signatures have no team and cannot match, so
        # the Mac app refuses to load its own embedded AMSMB2.framework:
        # "different Team IDs". It also buys nothing here, since hardened
        # runtime only matters for notarization, which needs a team anyway.
        #
        # Turn this back ON together with DEVELOPMENT_TEAM if you notarize.
        ENABLE_HARDENED_RUNTIME: NO

        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SimpleSMBFileBrowserTests:
    templates: [adhocSigned]
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/UnitTests
    dependencies:
      - target: SimpleSMBFileBrowser
      - package: AMSMB2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.org.amirulandalib.SimpleSMBFileBrowserTests
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Simple SMB.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Simple SMB"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SimpleSMBFileBrowserUITests:
    templates: [adhocSigned]
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: SimpleSMBFileBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.org.amirulandalib.SimpleSMBFileBrowserUITests
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SimpleSMBFileBrowser

schemes:
  SimpleSMBFileBrowser:
    build:
      targets:
        SimpleSMBFileBrowser: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SimpleSMBFileBrowserTests
        - SimpleSMBFileBrowserUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
