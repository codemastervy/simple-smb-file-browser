# XcodeGen spec — the source of truth for SimpleSMBFileBrowser.xcodeproj.
#
# The generated .xcodeproj IS committed, so the repo can be opened without any
# extra tooling. Regenerate after changing this file with:
#     xcodegen generate
# See README.md ("Project generation") for why the project is generated.

name: SimpleSMBFileBrowser

options:
  bundleIdPrefix: eu.org.amirulandalib
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: true

packages:
  AMSMB2:
    url: https://github.com/amosavian/AMSMB2.git
    from: 4.0.3

# Settings shared by every target.
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Signing is declared per-target via the adhocSigned template below, not
    # here: XcodeGen injects its own target-level preset
    # (CODE_SIGN_IDENTITY = "iPhone Developer") for iOS application targets,
    # and a target-level setting beats a project-level one.

targetTemplates:
  # Ad-hoc signing ("Sign to Run Locally"). No Apple Developer team is assumed,
  # so the project builds, runs and tests on all three platforms out of the box.
  # See README for switching to a real team.
  adhocSigned:
    settings:
      base:
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

targets:
  SimpleSMBFileBrowser:
    templates: [adhocSigned]
    # A single multiplatform target (iPhone, iPad, Mac) rather than one target
    # per platform, matching Xcode's own Multiplatform App template: SDKROOT is
    # resolved per-destination and TARGETED_DEVICE_FAMILY spans 1,2,6.
    type: application
    platform: iOS
    sources:
      - path: SimpleSMBFileBrowser
        excludes:
          - "Resources/Info.plist"
          - "Resources/*.entitlements"
    dependencies:
      - package: AMSMB2
    settings:
      base:
        PRODUCT_NAME: Simple SMB
        PRODUCT_BUNDLE_IDENTIFIER: eu.org.amirulandalib.SimpleSMBFileBrowser
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        TARGETED_DEVICE_FAMILY: "1,2,6"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"

        # Info.plist: generated keys plus a small partial plist holding the
        # entries Xcode has no INFOPLIST_KEY_ equivalent for (local network
        # usage, queryable URL schemes, document-in-place support).
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: SimpleSMBFileBrowser/Resources/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Simple SMB
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities

        CODE_SIGN_ENTITLEMENTS: SimpleSMBFileBrowser/Resources/SimpleSMBFileBrowser.entitlements
        ENABLE_HARDENED_RUNTIME: YES

        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  SimpleSMBFileBrowserTests:
    templates: [adhocSigned]
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/UnitTests
    dependencies:
      - target: SimpleSMBFileBrowser
      - package: AMSMB2
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.org.amirulandalib.SimpleSMBFileBrowserTests
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Simple SMB.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Simple SMB"
        BUNDLE_LOADER: "$(TEST_HOST)"

  SimpleSMBFileBrowserUITests:
    templates: [adhocSigned]
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/UITests
    dependencies:
      - target: SimpleSMBFileBrowser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.org.amirulandalib.SimpleSMBFileBrowserUITests
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SimpleSMBFileBrowser

schemes:
  SimpleSMBFileBrowser:
    build:
      targets:
        SimpleSMBFileBrowser: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SimpleSMBFileBrowserTests
        - SimpleSMBFileBrowserUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
